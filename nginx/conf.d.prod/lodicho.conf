# Rate limit agresivo sobre /api/v1/consulta: cada llamada dispara
# clasificacion + recuperacion + (eventualmente) generacion, y eso cuesta dinero.
limit_req_zone $binary_remote_addr zone=consulta_zone:10m rate=5r/m;
# /api/v1/veredicto dispara hasta 5 llamadas a Gemini Pro (auto-consistencia
# x3 + reintento + anclaje) por request — mas caro que /consulta, rate mas bajo.
limit_req_zone $binary_remote_addr zone=veredicto_zone:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/m;

upstream lodicho_api {
    server api:8000;
}

# --- Variante para el VPS compartido (ver docs/deploy.md) ---
# Aqui nginx NO termina TLS ni publica 80/443: el nginx del host recibe
# el trafico (Cloudflare -> host nginx con certbot) y lo proxea a este
# contenedor por 127.0.0.1. Este conf solo escucha HTTP en la red interna.
# El host reenvia la IP real del cliente en X-Real-IP; sin esto, los
# rate limits de abajo contarian a todo el mundo como una sola IP.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Real-IP;

# Conserva el esquema original (https) que mando el host/Cloudflare.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name lodicho.zamarrito.com;

    client_max_body_size 10M;

    location /api/v1/consulta {
        limit_req zone=consulta_zone burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://lodicho_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        # Respuesta SSE: sin buffering ni cache, timeout largo.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/v1/veredicto {
        limit_req zone=veredicto_zone burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://lodicho_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        # Respuesta SSE: la conexion espera el job ARQ (timeout de la app
        # es 150s) — sin buffering ni cache, timeout mayor que el del job.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    # Conversion de PDF con Docling: puede tardar varios minutos,
    # sobre todo la primera vez que carga los modelos de layout.
    # Timeout largo aparte del /api/ general para no cortar la conexion
    # a mitad de una conversion real.
    location /api/v1/admin/ {
        limit_req zone=api_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://lodicho_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        proxy_read_timeout 600s;   # antes: 300s
        proxy_send_timeout 600s;   # antes: 300s
    }

    location /api/ {
        limit_req zone=api_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://lodicho_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Nunca cachear el service worker: el navegador debe poder detectar una
    # version nueva del app shell sin esperar a que expire un cache HTTP.
    location = /service-worker.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
