# Vhost del nginx del HOST -> /etc/nginx/sites-available/lodicho.zamarrito.com
# (symlink en sites-enabled). Solo HTTP: `certbot --nginx -d lodicho.zamarrito.com`
# agrega el bloque 443 y la redireccion, igual que en los otros vhosts.
# No declara real_ip_header / set_real_ip_from: ya son globales en el host.
server {
    listen 80;
    listen [::]:80;
    server_name lodicho.zamarrito.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:18090;   # LODICHO_HTTP_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/consulta, /veredicto) y conversion Docling (hasta 600s).
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
