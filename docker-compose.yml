services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./web:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - lodicho_net
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Reintenta la renovacion cada 12h; certbot no renueva hasta que falten
    # <30 dias de vigencia, asi que la mayoria de las corridas no hacen nada.
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"
    networks:
      - lodicho_net
    restart: unless-stopped

  api:
    build:
      context: ./api
    env_file:
      - .env
    volumes:
      # lodicho-corpus como hermano de este repo (repo separado a
      # proposito, ver CLAUDE.md). Lectura-escritura: el panel de admin
      # escribe el .md/PDF nuevo aca antes de commitear. Si no existe
      # todavia en esta maquina, Docker crea un directorio vacio y
      # scripts/ingest_corpus.py simplemente no encuentra nada para
      # ingestar.
      - ../lodicho-corpus:/corpus
      # Deploy key SSH dedicada (solo escritura en lodicho-corpus) para
      # que el panel de admin pueda commitear + pushear sin que nadie
      # toque una terminal. Nunca la corriente/personal de nadie.
      - ./secrets/corpus_deploy_key:/run/secrets/corpus_deploy_key:ro
      # Audio original de las consultas por voz (evidencia ante impugnacion).
      - audio_data:/audio
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - lodicho_net
    restart: unless-stopped

  worker:
    build:
      context: ./api
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - lodicho_net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lodicho_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - lodicho_net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - lodicho_net
    restart: unless-stopped

networks:
  lodicho_net:
    driver: bridge

volumes:
  audio_data:
  postgres_data:
  qdrant_data:
